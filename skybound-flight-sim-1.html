<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06101c">
<title>Skybound – Flight Simulator</title>
<style>
:root{
  --bg:#050d18; --panel:rgba(9,20,36,.78); --panel2:rgba(16,32,54,.86); --line:rgba(150,200,255,.16); --line2:rgba(150,200,255,.32);
  --tx:#e8f1fb; --dim:#8fa6c0; --acc:#46c8f5; --acc2:#7be0ff; --amb:#ffb703; --good:#4fe08a; --bad:#ff5a5a; --warn:#ffb703;
  --r:14px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#8fb4e0}
canvas#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#dbg{position:fixed;left:6px;bottom:4px;font:10px monospace;color:#fff;opacity:.0;pointer-events:none;white-space:pre}
button{font:inherit;color:inherit;cursor:pointer}
kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:rgba(255,255,255,.08);font:600 .85em ui-monospace,Menlo,Consolas,monospace;color:var(--acc2);margin:0 1px}
.hide{display:none!important}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 20%,#123055 0%,#06101c 60%,#030810 100%);transition:opacity .6s}
#loader .logo{font-size:clamp(38px,9vw,84px);font-weight:800;letter-spacing:.18em;margin-right:-.18em;background:linear-gradient(180deg,#fff,#7bd3ff 60%,#2c8fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
#loader .sub{color:var(--dim);letter-spacing:.35em;font-size:12px;text-transform:uppercase}
#loader .bar{width:min(340px,70vw);height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#fff);transition:width .25s}
#loader .msg{font-size:12px;color:var(--dim);min-height:16px}
#loader .go{margin-top:10px}
.plane-ico{width:90px;height:90px;opacity:.9;animation:fl 3.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(2deg)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.07);font-weight:600;letter-spacing:.02em;transition:transform .08s,background .15s,border-color .15s;min-height:44px}
.btn:hover{background:rgba(255,255,255,.14);border-color:var(--acc)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#2db4ec,#1581c0);border-color:#6fd6ff;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:0 6px 20px rgba(30,150,220,.35)}
.btn.pri:hover{background:linear-gradient(180deg,#4cc6fa,#1b93d8)}
.btn.amb{background:linear-gradient(180deg,#ffc83d,#e59700);border-color:#ffd978;color:#201400;text-shadow:none}
.btn.bad{border-color:#a94444;color:#ffb0b0}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none;filter:grayscale(.6)}

/* ---------- screens ---------- */
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) calc(18px + var(--safe-r)) calc(14px + var(--safe-b)) calc(18px + var(--safe-l));overflow:hidden;touch-action:pan-y}
.scr.dark{background:linear-gradient(180deg,rgba(3,8,16,.62),rgba(3,8,16,.82))}
.scr.glass{background:linear-gradient(90deg,rgba(3,9,18,.88) 0%,rgba(3,9,18,.62) 45%,rgba(3,9,18,.05) 100%)}
.topbar{display:flex;align-items:center;gap:12px;flex:0 0 auto;margin-bottom:12px}
.topbar h1{margin:0;font-size:clamp(18px,3.2vw,26px);font-weight:700;letter-spacing:.04em;flex:1}
.topbar h1 small{display:block;font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.08em;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip b{color:var(--amb)}
.chip.rank{border-color:rgba(70,200,245,.4)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 2px 24px;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(150,200,255,.3) transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .1s;overflow:hidden}
button.card:hover,.card.click:hover{border-color:var(--acc);transform:translateY(-1px)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 8px 28px rgba(40,160,230,.18)}
.card.lock{opacity:.5;filter:grayscale(.6)}
.card h3{margin:0;font-size:16px;letter-spacing:.02em}
.card p{margin:0;font-size:13px;color:var(--dim);line-height:1.4}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.card .tag{padding:2px 8px;border-radius:99px;background:rgba(70,200,245,.14);color:var(--acc2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card .tag.amb{background:rgba(255,183,3,.16);color:var(--amb)}
.card .tag.g{background:rgba(79,224,138,.16);color:var(--good)}
.card .tag.r{background:rgba(255,90,90,.16);color:var(--bad)}
.stars{letter-spacing:2px;color:#4a5b72;font-size:14px}.stars .on{color:var(--amb)}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#33465e;margin-right:3px}.dots i.on{background:var(--amb)}
.sec{margin:16px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acc2);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec em{font-style:normal;color:var(--dim);letter-spacing:.05em;text-transform:none;font-weight:500}

/* ---------- home ---------- */
#home .wrap{flex:1;display:flex;min-height:0}
#home .side{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:none;touch-action:pan-y;padding-bottom:10px}
#home .brand{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:.16em;line-height:1;background:linear-gradient(180deg,#fff,#7bd3ff 65%,#2c8fd0);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(70,200,245,.2)}
#home .tag2{font-size:11px;letter-spacing:.38em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.pilot{flex-direction:row;display:flex;gap:12px;align-items:center;padding:12px 14px}
.badge{width:54px;height:54px;flex:0 0 54px;border-radius:12px;background:linear-gradient(160deg,#102846,#0a1a30);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bars{display:flex;flex-direction:column;gap:2px;align-items:center}.bars i{display:block;width:30px;height:4px;background:linear-gradient(90deg,#c79a2e,#ffd463,#c79a2e);border-radius:1px}
.bars s{text-decoration:none;color:var(--amb);font-size:11px;line-height:1}
.pilot .nm{font-weight:700;font-size:16px}.pilot .rk{font-size:12px;color:var(--acc2);letter-spacing:.06em}
.xp{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#fff)}
.menu{display:flex;flex-direction:column;gap:9px}
.mbtn{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:13px;background:var(--panel);border:1px solid var(--line);text-align:left;font-weight:650;font-size:16px;letter-spacing:.03em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .14s}
.mbtn:hover{border-color:var(--acc);background:var(--panel2);transform:translateX(4px)}
.mbtn .ic{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:rgba(70,200,245,.14);display:flex;align-items:center;justify-content:center;font-size:18px}
.mbtn small{display:block;font-size:12px;color:var(--dim);font-weight:500;letter-spacing:0;margin-top:1px}
.mbtn.main{background:linear-gradient(180deg,rgba(45,180,236,.9),rgba(21,129,192,.9));border-color:#7ddcff;box-shadow:0 8px 28px rgba(30,150,220,.35)}
.mbtn.main .ic{background:rgba(255,255,255,.2)}.mbtn.main small{color:#d8f3ff}
#home .hero{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:0 4px 10px;pointer-events:none;text-align:right}
#home .hero .pn{font-size:clamp(18px,3vw,30px);font-weight:700;letter-spacing:.05em;text-shadow:0 2px 16px rgba(0,0,0,.6)}
#home .hero .pc{color:var(--acc2);font-size:13px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
select,input[type=text],input[type=search]{width:100%;padding:11px 12px;border-radius:10px;background:rgba(7,16,30,.9);border:1px solid var(--line2);color:var(--tx);font:inherit;min-height:44px;-webkit-user-select:text;user-select:text}
select:focus,input:focus{outline:1px solid var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13px;font-weight:600;min-height:40px}
.seg button.on{background:rgba(70,200,245,.2);border-color:var(--acc);color:#fff}
.seg button.dis{opacity:.35;pointer-events:none}
.rng{display:flex;align-items:center;gap:10px}.rng input{flex:1;accent-color:var(--acc)}.rng span{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--acc2);font-size:13px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.tog b{font-weight:600;font-size:14px}.tog small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.sw{position:relative;width:46px;height:26px;border-radius:26px;background:#2a3b52;border:none;flex:0 0 46px;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.panelbox{padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panelbox h4{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.stat{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.stat:last-child{border:0}.stat span{color:var(--dim)}.stat b{font-variant-numeric:tabular-nums}
.meter{height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;flex:1}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#9fe6ff)}
.sp{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);padding:4px 0}.sp span:first-child{width:72px}.sp b{width:64px;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px}.rung.cur{border-color:var(--amb);background:rgba(255,183,3,.08)}.rung.done{opacity:.55}.rung .xpv{margin-left:auto;color:var(--dim);font-size:12px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;font-size:14px}
.li:hover{border-color:var(--acc)}.li.sel{border-color:var(--acc);background:var(--panel2)}
.li .id{font:700 12px ui-monospace,Menlo,monospace;color:var(--acc2);width:44px}.li .c{flex:1;min-width:0}.li .c small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hangar{display:flex;gap:14px;flex:1;min-height:0}.hangar .lst{width:min(360px,44%);overflow-y:auto;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;padding-bottom:20px}.hangar .det{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-width:0;overflow-y:auto;touch-action:pan-y}
@media(max-width:760px){.hangar{flex-direction:column}.hangar .lst{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;flex:0 0 auto}.hangar .lst .card{min-width:200px}.hangar .det{justify-content:flex-start}}
.price{font-weight:800;color:var(--amb);font-size:18px}

/* ---------- modal / result ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--safe-t)) 14px calc(14px + var(--safe-b));background:rgba(2,6,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:pan-y}
.dlg{width:min(560px,100%);max-height:100%;overflow-y:auto;border-radius:20px;background:linear-gradient(180deg,rgba(18,36,60,.97),rgba(8,18,32,.98));border:1px solid var(--line2);box-shadow:0 20px 80px rgba(0,0,0,.6);padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:24px;letter-spacing:.04em}.dlg p{margin:0;color:var(--dim);line-height:1.5}
.dlg .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.dlg .acts .btn{flex:1 1 140px}
.grade{width:92px;height:92px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;border:2px solid;flex:0 0 92px}
.g-S,.g-A{color:var(--good);border-color:var(--good);background:rgba(79,224,138,.1)}.g-B,.g-C{color:var(--acc2);border-color:var(--acc);background:rgba(70,200,245,.1)}.g-D,.g-E{color:var(--amb);border-color:var(--amb);background:rgba(255,183,3,.1)}.g-F{color:var(--bad);border-color:var(--bad);background:rgba(255,90,90,.1)}
.res-head{display:flex;gap:16px;align-items:center}
.rrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0}.rrow span{width:140px;color:var(--dim)}.rrow em{font-style:normal;width:150px;text-align:right;font-size:12px;color:var(--dim)}
.cash{font-size:22px;font-weight:800;color:var(--amb)}.cash.neg{color:var(--bad)}
.promo{padding:12px;border-radius:12px;background:linear-gradient(90deg,rgba(255,183,3,.18),rgba(255,183,3,.04));border:1px solid var(--amb);font-weight:700;text-align:center;letter-spacing:.04em;color:#ffe29a;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 24px rgba(255,183,3,.4)}}
#toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-80px);z-index:70;padding:10px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--acc);font-weight:600;transition:transform .35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}

/* ---------- in-flight overlay ---------- */
#fly{position:fixed;inset:0;z-index:10;pointer-events:none;touch-action:none;display:none}
#fly.on{display:block}
#fly .abs{position:absolute}
.ibtn{pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(8,18,32,.6);border:1px solid var(--line2);color:var(--tx);font-weight:700;font-size:12px;letter-spacing:.04em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none;min-width:46px;min-height:46px;padding:0 10px;transition:background .1s}
.ibtn:active,.ibtn.act{background:rgba(70,200,245,.45);border-color:var(--acc2)}
.ibtn.on{background:rgba(79,224,138,.28);border-color:var(--good);color:#d6ffe6}
.ibtn.warn{background:rgba(255,90,90,.3);border-color:var(--bad)}
.ibtn small{display:block;font-size:9px;opacity:.7;font-weight:600}
#topl{left:calc(10px + var(--safe-l));top:calc(8px + var(--safe-t));display:flex;gap:8px;align-items:center}
#info{left:calc(10px + var(--safe-l));top:calc(64px + var(--safe-t));padding:8px 11px;border-radius:12px;background:rgba(6,14,26,.55);border:1px solid var(--line);font-size:12px;line-height:1.5;min-width:160px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#info b{color:var(--acc2);font-variant-numeric:tabular-nums}
#info .w{display:flex;align-items:center;gap:6px}
#info .wa{display:inline-block;width:14px;height:14px;transition:transform .3s}
#topr{right:calc(10px + var(--safe-r));top:calc(8px + var(--safe-t));display:flex;gap:8px;flex-direction:column;align-items:flex-end}
#mini{pointer-events:auto;border-radius:12px;border:1px solid var(--line2);overflow:hidden;background:#0a1a2c}
#mini canvas{display:block}
#msgs{left:50%;top:calc(46px + var(--safe-t));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(560px,70vw)}
.msg{padding:8px 16px;border-radius:12px;background:rgba(6,14,26,.7);border:1px solid var(--line2);font-weight:600;font-size:15px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:in .25s}
.msg.good{border-color:var(--good);color:#d6ffe6}.msg.warn{border-color:var(--warn);color:#ffe9b3}.msg.bad{border-color:var(--bad);color:#ffc9c9}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
#guide{left:calc(10px + var(--safe-l));bottom:calc(14px + var(--safe-b));width:min(380px,46vw);padding:12px 14px;border-radius:14px;background:rgba(6,16,30,.82);border:1px solid var(--acc);box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#guide .gt{font-size:11px;letter-spacing:.14em;color:var(--acc2);text-transform:uppercase;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
#guide .gx{font-size:15px;line-height:1.4;font-weight:500}
#guide .gh{margin-top:8px;padding:7px 10px;border-radius:9px;background:rgba(70,200,245,.14);font-size:13px;color:#cdeeff}
#guide .btn{margin-top:8px;width:100%}
#center{left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-weight:900;letter-spacing:.12em;font-size:clamp(22px,4vw,40px)}
#center .w{display:none;padding:6px 18px;border-radius:10px;animation:bl .5s steps(2) infinite}
#center .w.on{display:block}
#center .w.red{background:rgba(255,40,40,.78);color:#fff}#center .w.amb{background:rgba(255,183,3,.85);color:#1a1000}
@keyframes bl{50%{opacity:.35}}
#touch{inset:0;display:none}
#touch.on{display:block}
#stick{left:calc(22px + var(--safe-l));bottom:calc(22px + var(--safe-b));width:var(--ss,150px);height:var(--ss,150px);border-radius:50%;border:2px solid rgba(150,210,255,.35);background:radial-gradient(circle,rgba(70,200,245,.14),rgba(8,18,32,.35));pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff0ff,#3aa9d9);box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* ---------- minimal math library (Vector3/Quaternion/Euler API-compatible subset) ---------- */

const DEG=Math.PI/180;
function _sstep(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
class Vector3{
  constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z;}
  set(x,y,z){this.x=x;this.y=y;this.z=z;return this;}
  copy(v){this.x=v.x;this.y=v.y;this.z=v.z;return this;}
  clone(){return new Vector3(this.x,this.y,this.z);}
  add(v){this.x+=v.x;this.y+=v.y;this.z+=v.z;return this;}
  sub(v){this.x-=v.x;this.y-=v.y;this.z-=v.z;return this;}
  multiplyScalar(s){this.x*=s;this.y*=s;this.z*=s;return this;}
  divideScalar(s){return this.multiplyScalar(1/s);}
  addScaledVector(v,s){this.x+=v.x*s;this.y+=v.y*s;this.z+=v.z*s;return this;}
  dot(v){return this.x*v.x+this.y*v.y+this.z*v.z;}
  lengthSq(){return this.x*this.x+this.y*this.y+this.z*this.z;}
  length(){return Math.sqrt(this.lengthSq());}
  normalize(){const l=this.length()||1;return this.multiplyScalar(1/l);}
  crossVectors(a,b){const x=a.y*b.z-a.z*b.y,y=a.z*b.x-a.x*b.z,z=a.x*b.y-a.y*b.x;this.x=x;this.y=y;this.z=z;return this;}
  applyQuaternion(q){
    const x=this.x,y=this.y,z=this.z,qx=q.x,qy=q.y,qz=q.z,qw=q.w;
    const ix=qw*x+qy*z-qz*y, iy=qw*y+qz*x-qx*z, iz=qw*z+qx*y-qy*x, iw=-qx*x-qy*y-qz*z;
    this.x=ix*qw+iw*-qx+iy*-qz-iz*-qy; this.y=iy*qw+iw*-qy+iz*-qx-ix*-qz; this.z=iz*qw+iw*-qz+ix*-qy-iy*-qx; return this;
  }
}
class Euler{constructor(x=0,y=0,z=0,order='XYZ'){this.x=x;this.y=y;this.z=z;this.order=order;}}
class Quaternion{
  constructor(x=0,y=0,z=0,w=1){this.x=x;this.y=y;this.z=z;this.w=w;}
  copy(q){this.x=q.x;this.y=q.y;this.z=q.z;this.w=q.w;return this;}
  clone(){return new Quaternion(this.x,this.y,this.z,this.w);}
  invert(){this.x=-this.x;this.y=-this.y;this.z=-this.z;return this;}
  normalize(){let l=Math.hypot(this.x,this.y,this.z,this.w)||1;this.x/=l;this.y/=l;this.z/=l;this.w/=l;return this;}
  multiply(b){const ax=this.x,ay=this.y,az=this.z,aw=this.w;
    this.x=ax*b.w+aw*b.x+ay*b.z-az*b.y; this.y=ay*b.w+aw*b.y+az*b.x-ax*b.z;
    this.z=az*b.w+aw*b.z+ax*b.y-ay*b.x; this.w=aw*b.w-ax*b.x-ay*b.y-az*b.z; return this;}
  setFromAxisAngle(ax,ang){const h=ang/2,s=Math.sin(h);this.x=ax.x*s;this.y=ax.y*s;this.z=ax.z*s;this.w=Math.cos(h);return this;}
  setFromEuler(e){ // only YXZ needed (yaw Y, pitch X, roll Z)
    const c1=Math.cos(e.x/2),c2=Math.cos(e.y/2),c3=Math.cos(e.z/2),s1=Math.sin(e.x/2),s2=Math.sin(e.y/2),s3=Math.sin(e.z/2);
    this.x=s1*c2*c3+c1*s2*s3; this.y=c1*s2*c3-s1*c2*s3; this.z=c1*c2*s3-s1*s2*c3; this.w=c1*c2*c3+s1*s2*s3; return this;}
}

const M4={
  create(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  identity(m){m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m;},
  perspective(m,fovy,asp,n,f){const t=1/Math.tan(fovy/2);m.fill(0);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;},
  mul(o,a,b){for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  fromQuat(m,q,x,y,z){const xx=q.x*q.x,yy=q.y*q.y,zz=q.z*q.z,xy=q.x*q.y,xz=q.x*q.z,yz=q.y*q.z,wx=q.w*q.x,wy=q.w*q.y,wz=q.w*q.z;

/* ---------- SKYBOUND WORLD ENGINE ---------- */
const World = (function(){
const W = {};
let MW=4096, MH=2048;          // mask size
const CW=1024, CH=512;         // climate size
let maskData, climData, noiseData;
let maskTex, climTex, noiseTex;
W.mapCanvas = null;            // stylised world map for HUD
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const mix=(a,b,t)=>a+(b-a)*t;

/* ---- polygon helpers ---- */
function fillPoly(ctx, arr, W_, H_, color){
  ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<arr.length;i+=2){
    const x=(arr[i]+180)/360*W_, y=(90-arr[i+1])/180*H_;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill();
}
function boxBlur(src,w,h,r,passes){
  let a=src, b=new Float32Array(w*h);
  for(let p=0;p<passes;p++){
    // horizontal
    for(let y=0;y<h;y++){
      let acc=0; const row=y*w;
      for(let x=-r;x<=r;x++) acc+=a[row+Math.min(w-1,Math.max(0,x))];
      for(let x=0;x<w;x++){
        b[row+x]=acc/(2*r+1);
        acc+=a[row+Math.min(w-1,x+r+1)]-a[row+Math.max(0,x-r)];
      }
    }
    // vertical
    for(let x=0;x<w;x++){
      let acc=0;
      for(let y=-r;y<=r;y++) acc+=b[Math.min(h-1,Math.max(0,y))*w+x];
      for(let y=0;y<h;y++){
        a===src && p===0 ? 0:0;
        const idx=y*w+x;
        const out=acc/(2*r+1);
        acc+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x];
        a[idx]=out;
      }
    }
  }
  return a;
}

/* ---- data generation ---- */
W.generate = async function(coast, maxTex, progress){
  progress=progress||(()=>{});
  if(maxTex<4096){MW=2048;MH=1024;}
  // 1. land mask
  await progress(0.05,'Drawing continents');
  const cv=document.createElement('canvas'); cv.width=MW; cv.height=MH;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#000'; ctx.fillRect(0,0,MW,MH);
  for(const k in coast.land) fillPoly(ctx,coast.land[k],MW,MH,'#fff');
  for(const k in coast.sea) fillPoly(ctx,coast.sea[k],MW,MH,'#000');
  const img=ctx.getImageData(0,0,MW,MH).data;
  let f=new Float32Array(MW*MH);
  for(let i=0;i<f.length;i++) f[i]=img[i*4]/255;
  await progress(0.15,'Smoothing coastlines');
  boxBlur(f,MW,MH,2,2);
  maskData=new Uint8Array(MW*MH);
  for(let i=0;i<f.length;i++) maskData[i]=Math.round(clamp(f[i],0,1)*255);
  // 2. climate
  await progress(0.3,'Painting climate');
  const R=new Float32Array(CW*CH), S=new Float32Array(CW*CH), B=new Float32Array(CW*CH), A=new Float32Array(CW*CH);
  for(let j=0;j<CH;j++){
    const lat=90-(j+0.5)/CH*180; const al=Math.abs(lat);
    const base=0.7*Math.exp(-Math.pow((al-26)/8,2));
    const snow=sstep(58,72,al);
    for(let i=0;i<CW;i++){ R[j*CW+i]=base; S[j*CW+i]=snow; }
  }
  const paint=(list,fn)=>{
    for(const e of list){
      const [cx,cy,rx,ry,rot,val]=e; const c=Math.cos(rot*Math.PI/180), s=Math.sin(rot*Math.PI/180);
      const ext=Math.max(rx,ry)*2.6;
      const i0=Math.max(0,Math.floor((cx-ext+180)/360*CW)), i1=Math.min(CW-1,Math.ceil((cx+ext+180)/360*CW));
      const j0=Math.max(0,Math.floor((90-cy-ext)/180*CH)), j1=Math.min(CH-1,Math.ceil((90-cy+ext)/180*CH));
      for(let j=j0;j<=j1;j++){
        const lat=90-(j+0.5)/CH*180;
        for(let i=i0;i<=i1;i++){
          const lon=(i+0.5)/CW*360-180;
          const dx=lon-cx, dy=lat-cy;
          const xr=(dx*c+dy*s)/rx, yr=(-dx*s+dy*c)/ry;
          const d2=xr*xr+yr*yr; if(d2>7) continue;
          fn(j*CW+i, val*Math.exp(-d2*1.3));
        }
      }
    }
  };
  paint(ARID,(k,v)=>{R[k]+=v;});
  paint(MOUNTS,(k,v)=>{B[k]=Math.max(B[k],v);});
  for(let k=0;k<R.length;k++) R[k]=clamp(R[k],0,1);
  // Greenland / Antarctic snow
  for(let j=0;j<CH;j++){ const lat=90-(j+0.5)/CH*180;
    for(let i=0;i<CW;i++){ const lon=(i+0.5)/CW*360-180;
      if(lat<-62) S[j*CW+i]=1;
      if(lat>59&&lat<84&&lon>-75&&lon<-12) S[j*CW+i]=Math.max(S[j*CW+i],sstep(60,66,lat)); } }
  // coast proximity
  await progress(0.45,'Computing shallow waters');
  const cl=new Float32Array(CW*CH); const sx=MW/CW, sy=MH/CH;
  for(let j=0;j<CH;j++) for(let i=0;i<CW;i++){
    let a=0; for(let y=0;y<sy;y++) for(let x=0;x<sx;x++) a+=maskData[(j*sy+y)*MW+i*sx+x];
    cl[j*CW+i]=a/(sx*sy*255);
  }
  boxBlur(cl,CW,CH,3,2);
  for(let k=0;k<A.length;k++) A[k]=cl[k];
  climData=new Uint8Array(CW*CH*4);
  for(let k=0;k<CW*CH;k++){
    climData[k*4]=Math.round(clamp(R[k],0,1)*255); climData[k*4+1]=Math.round(clamp(S[k],0,1)*255);
    climData[k*4+2]=Math.round(clamp(B[k],0,1)*255); climData[k*4+3]=Math.round(clamp(A[k],0,1)*255);
  }
  // 3. noise texture: smooth tileable value noise, 4 channels
  await progress(0.55,'Seeding terrain noise');
  noiseData=new Uint8Array(256*256*4);
  let seed=1337; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0; return seed/4294967296;};
  for(let ch=0;ch<4;ch++){
    const L=64, lat=new Float32Array(L*L); for(let i=0;i<L*L;i++) lat[i]=rnd();
    for(let y=0;y<256;y++) for(let x=0;x<256;x++){
      const fx=x/4, fy=y/4, x0=Math.floor(fx), y0=Math.floor(fy);
      let tx=fx-x0, ty=fy-y0; tx=tx*tx*tx*(tx*(tx*6-15)+10); ty=ty*ty*ty*(ty*(ty*6-15)+10);
      const g=(a,b)=>lat[((b%L)*L)+(a%L)];
      const v=mix(mix(g(x0,y0),g(x0+1,y0),tx),mix(g(x0,y0+1),g(x0+1,y0+1),tx),ty);
      noiseData[(y*256+x)*4+ch]=Math.round(v*255);
    }
  }
  // 4. stylised map canvas
  await progress(0.7,'Drawing charts');
  const mc=document.createElement('canvas'); mc.width=2048; mc.height=1024; const mctx=mc.getContext('2d');
  const mimg=mctx.createImageData(2048,1024); const md=mimg.data;
  for(let y=0;y<1024;y++){ const lat=90-(y+.5)/1024*180;
    for(let x=0;x<2048;x++){
      const u=(x+.5)/2048, v=(y+.5)/1024;
      const m=maskData[Math.min(MH-1,Math.floor(v*MH))*MW+Math.min(MW-1,Math.floor(u*MW))]/255;
      const ci=(Math.min(CH-1,Math.floor(v*CH))*CW+Math.min(CW-1,Math.floor(u*CW)))*4;
      const ar=climData[ci]/255, sn=climData[ci+1]/255, mt=climData[ci+2]/255, co=climData[ci+3]/255;
      let r,g,b;
      if(m<0.5){ const d=Math.pow(co,0.7); r=mix(10,40,d); g=mix(30,110,d); b=mix(62,130,d); const shade=0.85+0.15*Math.cos(lat*0.05); r*=shade; g*=shade; b*=shade; }
      else { r=mix(70,205,ar); g=mix(125,178,ar); b=mix(60,120,ar);
        r=mix(r,150,mt*0.6); g=mix(g,140,mt*0.6); b=mix(b,125,mt*0.6);
        r=mix(r,240,sn); g=mix(g,245,sn); b=mix(b,250,sn); }
      const k=(y*2048+x)*4; md[k]=r; md[k+1]=g; md[k+2]=b; md[k+3]=255;
    }
  }
  mctx.putImageData(mimg,0,0); W.mapCanvas=mc;
  await progress(0.8,'Uploading textures');
};

/* ---- JS sampling (mirrors GPU bilinear) ---- */
function samp1(data,w,h,u,v){
  let x=u*w-0.5, y=v*h-0.5; x=clamp(x,0,w-1); y=clamp(y,0,h-1);
  const x0=Math.floor(x), y0=Math.floor(y), x1=Math.min(w-1,x0+1), y1=Math.min(h-1,y0+1), tx=x-x0, ty=y-y0;
  return mix(mix(data[y0*w+x0],data[y0*w+x1],tx),mix(data[y1*w+x0],data[y1*w+x1],tx),ty)/255;
}
function sampClim(u,v,ch){
  let x=u*CW-0.5, y=v*CH-0.5; x=clamp(x,0,CW-1); y=clamp(y,0,CH-1);
  const x0=Math.floor(x), y0=Math.floor(y), x1=Math.min(CW-1,x0+1), y1=Math.min(CH-1,y0+1), tx=x-x0, ty=y-y0;
  const g=(a,b)=>climData[(b*CW+a)*4+ch];
  return mix(mix(g(x0,y0),g(x1,y0),tx),mix(g(x0,y1),g(x1,y1),tx),ty)/255;
}
function nt(x,z,wl,ch,off){
  const u=(x+off)/(wl*256), v=(z+off*0.7)/(wl*256);
  let fx=u*256-0.5, fy=v*256-0.5; const x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
  const g=(a,b)=>noiseData[((((b%256)+256)%256)*256+(((a%256)+256)%256))*4+ch];
  return mix(mix(g(x0,y0),g(x0+1,y0),tx),mix(g(x0,y0+1),g(x0+1,y0+1),tx),ty)/255;
}
const PLAT_R = a => a.table?-2000 : (a.rw.length>1?3800:3000);
W.platR = PLAT_R;
W.maskAt=(x,z)=>samp1(maskData,MW,MH,x/(KX*360)+0.5,(90+z/KY)/180);
W.coastMM=(x,z)=>{
  const m=W.maskAt(x,z);
  const n=0.5*nt(x,z,6000,0,0)+0.3*nt(x,z,1500,1,0)+0.2*nt(x,z,400,2,0);
  return m+(n-0.5)*0.30;
};
W.baseTerrain=function(x,z){
  const u=x/(KX*360)+0.5, v=(90+z/KY)/180;
  const mm=W.coastMM(x,z);
  const landH=sstep(0.50,0.70,mm);
  if(landH<=0) return 0;
  const base=sampClim(u,v,2);
  const f1=nt(x,z,40000,0,0), f2=nt(x,z,13000,1,0), f3=nt(x,z,4200,2,0), f4=nt(x,z,1400,3,0), f5=nt(x,z,470,0,1234.5);
  const ridge=1-Math.abs(2*f2-1);
  const amp=110+800*base;
  const f6=nt(x,z,150,1,222.2), f7=nt(x,z,50,2,91.7);
  const detail=amp*(0.5*f1+0.3*ridge+0.25*f3+0.12*f4+0.06*f5+0.035*f6+0.02*f7);
  return landH*(base*4300*(0.6+0.8*f2)+detail);
};
W.height=function(x,z){
  let h=W.baseTerrain(x,z);
  for(let i=0;i<AIRPORTS.length;i++){
    const a=AIRPORTS[i]; const dx=x-a.x, dz=z-a.z;
    if(Math.abs(dx)>11000||Math.abs(dz)>11000) continue;
    const Rr=PLAT_R(a), tab=Rr<0, R=Math.abs(Rr), d=Math.sqrt(dx*dx+dz*dz);
    const outer=R*(tab?1.35:2.6);
    if(d>=outer) continue;
    const w=1-sstep(R,outer,d);
    const el=Math.max(1,a.elev);
    if(tab) h=Math.min(h,el-45);
    h=mix(h,el,w);
  }
  return h;
};
W.isLandish=(x,z)=>W.coastMM(x,z)>0.5;
W.slope=function(x,z){const e=30,h0=W.height(x,z);return Math.hypot(W.height(x+e,z)-h0,W.height(x,z+e)-h0)/e;};

/* ---- airports: surfaces ---- */
function rwBasis(a,r){ // returns center, dir, right for runway r
  const h=r[0]*Math.PI/180; const dir={x:Math.sin(h),z:-Math.cos(h)}, right={x:Math.cos(h),z:Math.sin(h)};
  return {cx:a.x+right.x*r[2], cz:a.z+right.z*r[2], dir, right, len:r[1], wid:r[1]>3000?60:45, h};
}
W.rwBasis=rwBasis;
W.runwayAt=function(x,z,margin){ // returns {apt,idx,along,lat,fwdHdg}
  margin=margin||0;
  for(const a of AIRPORTS){
    const dx=x-a.x, dz=z-a.z; if(Math.abs(dx)>6500||Math.abs(dz)>6500) continue;
    for(let i=0;i<a.rw.length;i++){
      const b=rwBasis(a,a.rw[i]); const px=x-b.cx, pz=z-b.cz;
      const along=px*b.dir.x+pz*b.dir.z, lat=px*b.right.x+pz*b.right.z;
      if(Math.abs(along)<=b.len/2+margin && Math.abs(lat)<=b.wid/2+margin) return {apt:a,idx:i,along,lat,b};
    }
  }
  return null;
};
W.surfaceAt=function(x,z){ // 0 grass, 1 paved, 2 off-airport
  for(const a of AIRPORTS){
    const dx=x-a.x, dz=z-a.z; if(Math.abs(dx)>6500||Math.abs(dz)>6500) continue;
    const R=Math.abs(PLAT_R(a));
    if(Math.hypot(dx,dz)>R*1.05) continue;
    for(let i=0;i<a.rw.length;i++){
      const b=rwBasis(a,a.rw[i]); const px=x-b.cx, pz=z-b.cz;
      const along=px*b.dir.x+pz*b.dir.z, lat=px*b.right.x+pz*b.right.z;
      if(Math.abs(along)<=b.len/2+60 && Math.abs(lat)<=b.wid/2+(i===0?330:20)) return {s:1,apt:a};
      if(Math.abs(along)<=b.len/2+60 && lat>b.wid/2+300 && lat<b.wid/2+700 && i===0) return {s:1,apt:a};
    }
    return {s:0,apt:a};
  }
  return {s:2,apt:null};
};
W.nearestAirport=function(x,z,maxd){
  let best=null,bd=maxd||1e12; for(const a of AIRPORTS){const d=Math.hypot(a.x-x,a.z-z); if(d<bd){bd=d;best=a;}} return best?{apt:best,d:bd}:null;
};
W.threshold=function(a,idx,reverse){ // returns {x,z,hdg} of landing threshold
  const r=a.rw[idx], b=rwBasis(a,r); const s=reverse?-1:1;
  return {x:b.cx - b.dir.x*s*b.len/2, z:b.cz - b.dir.z*s*b.len/2, hdg:(r[0]+(reverse?180:0))%360, len:b.len, dir:{x:b.dir.x*s,z:b.dir.z*s}, right:{x:b.right.x*s,z:b.right.z*s}, wid:b.wid};
};

W.data=()=>({maskData,MW,MH,climData,CW,CH,noiseData});
W.nt=nt;
return W;
})();

const FOG_GLSL=`
uniform vec3 uSunDir,uSunCol,uAmb,uGnd,uFogCol,uZen; uniform float uFogDen,uNight,uTime;
vec3 applyFog(vec3 col,float dist,vec3 vdir){

/* ---------------- noise glsl ---------------- */
const NOISE_GLSL=`
uniform sampler2D uNoise;
float nt(vec2 p,float wl,vec4 m,float off){ vec2 q=(p+vec2(off,off*0.7))/(wl*256.0); return dot(texture(uNoise,q),m); }
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }

const KXs=KX.toFixed(3), KYs=KY.toFixed(3);
const TERRAIN_HEIGHT=`
uniform sampler2D uMask; uniform sampler2D uClim; uniform vec4 uApt[6];
const float KXc=${KXs}; const float KYc=${KYs};
const vec4 C0=vec4(1.,0.,0.,0.), C1=vec4(0.,1.,0.,0.), C2=vec4(0.,0.,1.,0.), C3=vec4(0.,0.,0.,1.);
float terrainH(vec2 p, float ce, out float plat){
  vec2 uv=vec2(p.x/(KXc*360.0)+0.5,(90.0+p.y/KYc)/180.0);
  float m=texture(uMask,uv).r;
  float n=0.5*nt(p,6000.,C0,0.)+0.3*nt(p,1500.,C1,0.)+0.2*nt(p,400.,C2,0.);
  float mm=m+(n-0.5)*0.30;
  float landH=smoothstep(0.50,0.70,mm);
  float h=0.0;
  if(landH>0.0){
    float base=texture(uClim,uv).b;
    float w1=smoothstep(2.*ce,4.*ce,40000.), w2=smoothstep(2.*ce,4.*ce,13000.), w3=smoothstep(2.*ce,4.*ce,4200.), w4=smoothstep(2.*ce,4.*ce,1400.), w5=smoothstep(2.*ce,4.*ce,470.), w6=smoothstep(2.*ce,4.*ce,150.), w7=smoothstep(2.*ce,4.*ce,50.);
    float f1=nt(p,40000.,C0,0.), f2=nt(p,13000.,C1,0.);
    float f3=w3>0.0?nt(p,4200.,C2,0.):0.5, f4=w4>0.0?nt(p,1400.,C3,0.):0.5, f5=w5>0.0?nt(p,470.,C0,1234.5):0.5;

const TERRAIN_VS=`
in vec2 aIJ;
uniform mat4 uVP; uniform vec2 uCenAbs; uniform vec2 uCenRel; uniform float uCell; uniform float uCamY;
${NOISE_GLSL}
${TERRAIN_HEIGHT}
out vec3 vN; out float vH; out vec2 vP; out float vPlat; out vec3 vRel; out float vDist;
float hAt(vec2 p,float ce){ float pl; return terrainH(p,ce,pl); }
void main(){
  float r=max(abs(aIJ.x),abs(aIJ.y))/48.0;

  else if(bz&&!bx&&mod(abs(aIJ.x),2.0)>0.5){ h=0.5*(hAt(p+vec2(uCell,0.),ce)+hAt(p-vec2(uCell,0.),ce)); }

  float hx=hAt(p+vec2(e,0.),ce), hz=hAt(p+vec2(0.,e),ce);
  vN=normalize(vec3(h-hx,e,h-hz));

uniform sampler2D uMask; uniform sampler2D uClim;

in vec3 vN; in float vH; in vec2 vP; in float vPlat; in vec3 vRel; in float vDist;

  float mm=m+(cn-0.5)*0.30;

      vec2 cq=vP/1900.0; vec2 cid=floor(cq); float rr=hash21(cid);

out vec2 vNdc; void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); vNdc=p*2.0-1.0; gl_Position=vec4(vNdc,0.9999,1.0); }`;

uniform vec3 uRight,uUp,uFwd; uniform float uTan,uAsp; uniform vec3 uHor;

in vec2 vNdc; out vec4 oCol;

R.init=function(cv,opts){

class Batch{

const vis=[];

    if(d<48000){ if(!o){ o=objs[a.id]=build(a); } vis.push(o); }
    else if(o&&d>70000){ free(o); delete objs[a.id]; }
  }
};
A.draw=function(cam,night){
  if(!vis.length) return;
  const gl=gl_();

      const ref=[2.2,2.8,3.2,3.8]; pp.lights.forEach((L,k)=>{ const white=ang>ref[k]; const c=white?[1,1,.95]:[1,.1,.06]; dyn.add(o.base[0]+L.x-cam.pos.x,o.base[1]+0.9-cam.pos.y,o.base[2]+L.z-cam.pos.z,c[0],c[1],c[2],1.0,2.4); }); }
  }

};
A.papiAngle=function(e,x,y,z,o){ // degrees of glide path angle from the PAPI box
  const t=e.thr; const px=t.x+t.dir.x*300, pz=t.z+t.dir.z*300; const dx=x-px, dz=z-pz; const along=-(dx*t.dir.x+dz*t.dir.z);

A.reset=A.dispose;

})();

/* ---------- SKYBOUND AUDIO (all synthesised with WebAudio, no files) ---------- */
const Sound=(function(){
const S={}; let ctx=null,master=null,eng=null,wind=null,rumble=null,warnG=null,noiseBuf=null; S.vol=0.7; S.muted=false;
function nbuf(){ const n=ctx.sampleRate*2, b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; l=l*0.5+w*0.5; d[i]=w*0.6+l*0.4; } return b; }
function noise(){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.start(); return s; }
S.start=function(){
  if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
  try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; return; }
  master=ctx.createGain(); master.gain.value=S.muted?0:S.vol; master.connect(ctx.destination); noiseBuf=nbuf();
  // engine: noise through lowpass + two oscillators
  const eg=ctx.createGain(); eg.gain.value=0; eg.connect(master);
  const n1=noise(), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400; n1.connect(lp); const ng=ctx.createGain(); ng.gain.value=0.5; lp.connect(ng); ng.connect(eg);
  const o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=60; const g1=ctx.createGain(); g1.gain.value=0.12; const lp2=ctx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=500; o1.connect(g1); g1.connect(lp2); lp2.connect(eg); o1.start();
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=800; const g2=ctx.createGain(); g2.gain.value=0.0; o2.connect(g2); g2.connect(eg); o2.start();
  const am=ctx.createOscillator(); am.frequency.value=25; const amg=ctx.createGain(); amg.gain.value=0; am.connect(amg); amg.connect(eg.gain); am.start();
  eng={g:eg,lp,ng,o1,g1,o2,g2,am,amg};

  const wg=ctx.createGain(); wg.gain.value=0; wg.connect(master); const wn=noise(), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.5; wn.connect(bp); bp.connect(wg); wind={g:wg,bp};

  const rg=ctx.createGain(); rg.gain.value=0; rg.connect(master); const rn=noise(), rl=ctx.createBiquadFilter(); rl.type='lowpass'; rl.frequency.value=120; rn.connect(rl); rl.connect(rg); rumble={g:rg,lp:rl};

S.setVolume=function(v){ S.vol=v; if(master) master.gain.setTargetAtTime(S.muted?0:v,ctx.currentTime,0.05); };
S.mute=function(m){ S.muted=m; if(master) master.gain.setTargetAtTime(m?0:S.vol,ctx.currentTime,0.05); };
/* per-frame: thr 0..1 (engine power), jet bool, speed m/s, onGround, gs m/s, engines count */
S.update=function(st){

    eng.o1.frequency.setTargetAtTime(55+60*p,t,0.1); eng.g1.gain.setTargetAtTime(0.10,t,0.1);
    eng.o2.frequency.setTargetAtTime(900+2400*p,t,0.1); eng.g2.gain.setTargetAtTime(0.012+0.025*p,t,0.1);
    eng.amg.gain.setTargetAtTime(0,t,0.1);
    eng.g.gain.setTargetAtTime((0.04+0.34*p)*(st.cabin?0.45:1),t,0.12);
  } else {
    eng.lp.frequency.setTargetAtTime(300+900*p,t,0.1); eng.ng.gain.setTargetAtTime(0.35,t,0.1);
    eng.o1.frequency.setTargetAtTime(62+40*p,t,0.1); eng.g1.gain.setTargetAtTime(0.28,t,0.1);
    eng.o2.frequency.setTargetAtTime(300+300*p,t,0.1); eng.g2.gain.setTargetAtTime(0.004,t,0.1);

let wTimer=0;
/* warnings: kind in '', 'stall','overspeed','pullup','gear','bank' – beeps scheduled from update */
S.warn=function(kind,dt){

};
S.sfx=function(k){
  if(!ctx) return;
  switch(k){
    case 'click': S.tone(880,0.05,0.08,'triangle'); break;
    case 'back': S.tone(520,0.06,0.07,'triangle'); break;
    case 'gear': S.noiseHit(0.8,0.35,260); S.tone(120,0.5,0.15,'sine'); break;
    case 'flaps': S.noiseHit(0.5,0.22,500); break;
    case 'chime': S.tone(988,0.25,0.15,'sine'); setTimeout(()=>S.tone(1319,0.35,0.15,'sine'),160); break;
    case 'touch': S.noiseHit(0.25,0.7,420); S.tone(70,0.2,0.3,'sine'); break;
    case 'hard': S.noiseHit(0.6,1.0,300); S.tone(55,0.5,0.5,'sine'); break;
    case 'crash': S.noiseHit(1.8,1.2,900); S.tone(48,1.2,0.6,'sawtooth',20); break;
    case 'success': [523,659,784,1047].forEach((f,i)=>setTimeout(()=>S.tone(f,0.35,0.16,'triangle'),i*120)); break;
    case 'rank': [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>S.tone(f,0.5,0.18,'triangle'),i*140)); break;
    case 'buy': S.tone(1200,0.1,0.14,'square'); setTimeout(()=>S.tone(1800,0.2,0.14,'square'),90); break;
    case 'deny': S.tone(200,0.25,0.15,'sawtooth'); break;
    case 'brake': S.noiseHit(0.4,0.25,2400); break;
    case 'step': S.tone(660,0.12,0.12,'sine'); setTimeout(()=>S.tone(990,0.18,0.12,'sine'),90); break;

});
let D=defaults();
P.listeners=[];
P.load=function(){ try{ const j=localStorage.getItem(KEY); if(j){ const o=JSON.parse(j); D=Object.assign(defaults(),o); D.s=Object.assign(defaults().s,o.s||{}); D.stats=Object.assign(defaults().stats,o.stats||{}); D.owned=Object.assign({saab340:true},o.owned||{}); } }catch(e){ D=defaults(); } return D; };

P.rankIdx=function(xp){ xp=xp===undefined?D.xp:xp; let r=0; for(let i=0;i<RANKS.length;i++) if(xp>=RANKS[i].xp) r=i; return r; };

/* returns {rankUp:bool, from, to} */

})();

    if(this.cfg.engineFail){ const dd=clampf(100-Math.max(0,tr.hdgDev-8)*4,0,100); parts.push({k:'Engine-out control',v:dd,note:'max heading drift '+tr.hdgDev.toFixed(0)+'°',w:30}); }
    for(const p of parts){ tot+=p.v*p.w; w+=p.w; } return {score:tot/w,parts};
  }
  scoreLanding(){
    const L=this.landed, d=L.d, sp=this.spec; const parts=[]; let tot=0,w=0;
    const e=this.destEnd; let along=0,lat=0,wid=45,len=3000;
    if(e){ const t=e.thr; const dx=d.x-t.x, dz=d.z-t.z; along=dx*t.dir.x+dz*t.dir.z; lat=dx*(-t.dir.z)+dz*t.dir.x; len=e.len; wid=t.wid||45; }
    const sink=d.sink; const sv=clampf(100-Math.max(0,sink-0.7)*45,0,100); parts.push({k:'Touchdown softness',v:sv,note:Math.round(sink*196.85)+' fpm',w:30});
    const cv=Math.abs(lat)<=3?100:Math.abs(lat)<wid/2?clampf(100-(Math.abs(lat)-3)/(wid/2-3)*70,30,100):0; parts.push({k:'Centreline',v:cv,note:Math.abs(lat).toFixed(0)+' m off centre',w:25});
    let zv; if(along<0) zv=10; else if(along<250) zv=40+60*along/250; else if(along<950) zv=100; else if(along<len*0.6) zv=clampf(100-(along-950)/(len*0.6-950)*60,30,100); else zv=15;
    parts.push({k:'Touchdown zone',v:zv,note:Math.round(along)+' m past threshold',w:20});
    const dsp=d.ias-sp.vref; const spv=clampf(100-Math.max(0,Math.abs(dsp-2)-7)*2.8,0,100); parts.push({k:'Approach speed',v:spv,note:Math.round(d.ias)+' kt (Vref '+sp.vref+')',w:15});
    const bk=Math.abs(d.bank); const bv=clampf(100-Math.max(0,bk-3)*9,0,100); parts.push({k:'Wings level',v:bv,note:bk.toFixed(0)+'° bank',w:10});
    for(const p of parts){ tot+=p.v*p.w; w+=p.w; } let score=tot/w; if(!L.ru) score*=0.6;

    return {score,parts};
  }
  /* ---------- finish ---------- */
  finish(ok,reason){
    if(this.result) return; const fm=this.fm; const sp=this.spec, c=this.cfg; const res={ok,reason:reason||null,parts:[],score:0,stars:0,cash:0,xp:0,lines:[]};
    const P=this.parts; const comps=[]; if(P.takeoff) comps.push([P.takeoff,0.35]); if(P.land) comps.push([P.land,0.65]);
    if(ok&&comps.length){ let s=0,ww=0; for(const [p,wt] of comps){ s+=p.score*wt; ww+=wt; } res.score=s/ww; for(const [p] of comps) res.parts.push(...p.parts); }
    else if(ok) res.score=100;
    // flying standards
    const tr=this.track; if(ok){ const pen=Math.min(15,tr.overT*1.5+tr.stallT*3); if(pen>0.5){ res.score=Math.max(0,res.score-pen); res.lines.push('Flying standards: −'+pen.toFixed(0)+' (stall / overspeed)'); } }
    res.score=Math.round(res.score); res.stars=!ok?0:(res.score>=88?3:res.score>=72?2:res.score>=50?1:0);
    res.grade=!ok?'F':res.score>=95?'S':res.score>=88?'A':res.score>=78?'B':res.score>=64?'C':res.score>=50?'D':'E';
    // rewards
    const m=this.mission, L=this.lesson; let cash=0,xp=0;
    if(ok){
      if(m){ cash=m.reward.cash; xp=m.reward.xp; }
      else if(L){ cash=L.reward.cash; xp=L.reward.xp; }
      else if(this.dest&&this.dest!==this.apt){ const km=this.realKm(); cash=Math.round((6000+km*55)*(0.4+0.8*res.score/100)*(1+0.18*(sp.rank||0))); xp=Math.round(60+km*0.12); }
      const mult=m||L?(0.55+0.65*res.score/100):1; cash=Math.round(cash*mult); xp=Math.round(xp*(m||L?(0.7+0.5*res.score/100):1));
      // repeat penalty
      const key=m?m.id:L?L.id:null; const prev=key?Profile.d().done[key]||(L&&Profile.d().lessons[L.id]?{n:1}:null):null;
      if(prev&&prev.n>0){ cash=Math.round(cash*0.4); xp=Math.round(xp*0.4); res.lines.push('Repeat flight – reduced rewards'); }
    } else if(m||this.dest){ const fee=Math.min(Profile.d().money,Math.round(400+sp.price*0.004)); if(!L&&this.cfg.fees!==false){ cash=-fee; res.lines.push('Repair & recovery fee '+Profile.fmtMoney(fee)); } }
    res.cash=cash; res.xp=xp;
    // profile updates
    const st=Profile.d().stats; st.flights++; st.hours+=this.t/3600; st.nm+=this.dist/NM*4; if(ok&&this.landed) st.landings++; if(!ok) st.crashes++; if(ok&&res.score>=95) st.perfect++;
    res.promo=Profile.award(xp,cash); if(Profile.d().money<0) Profile.d().money=0;
    if(ok){ if(m) res.rec=Profile.recordMission(m.id,res.stars,res.score); if(L){ const had=Profile.d().lessons[L.id]; Profile.d().lessons[L.id]=Math.max(had||0,res.stars||1); } }
    Profile.addLog({t:Date.now(),plane:sp.id,from:this.apt.id,to:this.dest?this.dest.id:'-',score:res.score,ok,title:this.briefLine(),cash});
    Profile.save(); res.title=this.briefLine(); this.result=res; this.state='done'; this.evq.push({t:'result',res});
  }
  realKm(){ if(!this.dest) return 0; return Math.hypot(this.dest.x-this.apt.x,this.dest.z-this.apt.z)*4/1000; }
  /* ---------- lessons ---------- */
  stepLesson(dt){
    const L=this.lesson, steps=L.steps; if(this.stepIdx>=steps.length) return;
    const s=steps[this.stepIdx]; this.stepT+=dt; const fm=this.fm;

    if(s.test(this,fm,this.stepT)){ s._entered=false; this.stepIdx++; if(this.stepIdx>=steps.length){ this.guideText=null; this.guideHint=null; this.guideAck=false; if(L.finish==='auto'){ this.finishLesson(); } } }
  }
  finishLesson(){ if(this.result) return; this.say('Lesson complete!','good',4); this.parts.lesson={score:100,parts:[]}; const sc=this.lesson.scoreFrom==='landing'&&this.parts.land?null:null; this.finish(true); }
  speak(text){
    if(!Profile.s().voice||!window.speechSynthesis||!text) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,'').replace(/[▲▼]/g,'')); u.rate=1.02; u.volume=Math.min(1,Profile.s().volume+0.2); speechSynthesis.speak(u); }catch(e){}
  }
  /* ---------- helpers for HUD ---------- */
  get ias(){ return this.fm.IAS/KT; }
}
return {Run,settle};

/* ---------- SKYBOUND HUD: canvas instruments + DOM overlay ---------- */
const HUD=(function(){
const H={}; let cv,ctx,W=1,Hh=1,dpr=1,mini,mctx;
const FT_=0.3048;

H.init=function(){ cv=$('hud'); ctx=cv.getContext('2d'); mini=$('minic'); mctx=mini.getContext('2d'); H.resize(); window.addEventListener('resize',H.resize); };
H.resize=function(){ dpr=Math.min(window.devicePixelRatio||1,2); const w=window.innerWidth,h=window.innerHeight; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); W=w; Hh=h; };
const units=()=>Profile.s().units;
const spdU=ms=>units()==='aviation'?ms/KT:ms*3.6, spdL=()=>units()==='aviation'?'KT':'KMH';
const altU=m=>units()==='aviation'?m/FT_:m, altL=()=>units()==='aviation'?'FT':'M';
const vsU=ms=>units()==='aviation'?ms/FT_*60:ms;
function txt(s,x,y,size,col,al,bold){ ctx.font=(bold?'700 ':'600 ')+size+'px ui-monospace,Menlo,Consolas,monospace'; ctx.textAlign=al||'center'; ctx.fillStyle=col||ink; ctx.fillText(s,x,y); }
function proj(cam,dx,dy,dz,f,cx,cy){ const x=dx*cam.right.x+dy*cam.right.y+dz*cam.right.z, y=dx*cam.up.x+dy*cam.up.y+dz*cam.up.z, z=dx*cam.fwd.x+dy*cam.fwd.y+dz*cam.fwd.z; if(z<=0.02) return null; return [cx+x/z*f, cy-y/z*f]; }
const dirOf=(h,p)=>{ const a=h*DEG,b=p*DEG; return [Math.sin(a)*Math.cos(b),Math.sin(b),-Math.cos(a)*Math.cos(b)]; };

/* ---------- main canvas ---------- */
H.draw=function(run,cam){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,Hh);
  if(!H.show||!run) return; const fm=run.fm, sp=run.spec; const S=Profile.s(); if(!S.hud) return;

H.warnings=function(run,dt){
  const fm=run.fm, r=$('w-red'), a=$('w-amb'); let red_='',amb_='',snd='';

  if(fm.stall){ red_='STALL'; snd='stall'; }
  else if(fm.overspeed){ red_='OVERSPEED'; snd='overspeed'; }

    // terrain ahead
    if(!fm.onGround&&fm.agl>5&&fm.agl<600){ const v=fm.vel, sp=Math.hypot(v.x,v.z)||1; let hit=false; for(const d of [800,1800,3000]){ const gx=fm.pos.x+v.x/sp*d, gz=fm.pos.z+v.z/sp*d; const h=World.height(gx,gz); if(h>fm.pos.y-70&&World.surfaceAt(gx,gz).s===2){ hit=true; break; } } if(hit){ red_='TERRAIN – PULL UP'; snd='pullup'; } }
    if(!red_&&fm.vs<-9&&fm.agl<150&&fm.agl>8&&run.nav&&!(run.nav.ils&&run.nav.ils.ad<400)){ red_='PULL UP'; snd='pullup'; }
    if(!red_&&fm.gearWarn){ amb_='GEAR!'; snd='gear'; }
    if(!red_&&!amb_&&Math.abs(fm.bankDeg())>50&&!fm.onGround){ amb_='BANK ANGLE'; snd='bank'; }
    if(!red_&&!amb_&&fm.stallWarn){ amb_='STALL WARNING'; snd='stall'; }
    if(!red_&&!amb_&&fm.vs<-6&&fm.agl<110&&fm.agl>10&&!fm.onGround){ amb_='SINK RATE'; snd='sink'; }
  }
  r.textContent=red_; r.classList.toggle('on',!!red_); a.textContent=amb_; a.classList.toggle('on',!!amb_); Sound.warn(snd,dt);
};

  if(view==='chase'){
    if(!cs.init){ cs.yaw=yawNow; cs.pit=pitNow*0.5; cs.init=true; cs.pos=null; }
    cs.yaw+=angd(yawNow,cs.yaw)*(1-Math.exp(-dt*3.2)); cs.pit+=(pitNow*0.55-cs.pit)*(1-Math.exp(-dt*2.5));
    orbit.yaw+=dx*0.006; orbit.pit=clampf(orbit.pit+dy*0.004,-0.3,1.1); if(!dx&&!dy){ orbit.yaw*=Math.exp(-dt*0.7); orbit.pit+=(0.12-orbit.pit)*(1-Math.exp(-dt*0.7)); }
    const zf=clampf(1+zoom*0.25,0.55,2.4); const dist=(L*1.15+16)*zf;
    const c=dirOf(cs.yaw+orbit.yaw,cs.pit*0.4-orbit.pit*0.6+0.0); const pos=fm.pos.clone().addScaledVector(c,-dist); pos.y+=L*0.10+3.2+dist*orbit.pit*0.22; groundClamp(pos,2.2);
    const tgt=fm.pos.clone().addScaledVector(c,dist*0.35); tgt.y+=L*0.04; setCam(pos,tgt.sub(pos),null,fov);
  } else if(view==='cockpit'){
    headLook.y=clampf(headLook.y+dx*0.005,-2.4,2.4); headLook.p=clampf(headLook.p+dy*0.004,-0.9,0.9); if(!dx&&!dy&&!Input.touch){ headLook.y*=Math.exp(-dt*0.8); headLook.p*=Math.exp(-dt*0.8); } else if(!dx&&!dy){ headLook.y*=Math.exp(-dt*1.2); headLook.p*=Math.exp(-dt*1.2); }
    const off=new V3(ac.cockpit[0],ac.cockpit[1]+0.15,ac.cockpit[2]-0.4).applyQuaternion(fm.quat); const pos=fm.pos.clone().add(off);
    const ql=new THREE.Quaternion().setFromEuler(new THREE.Euler(-headLook.p,-headLook.y,0,'YXZ')); const q=fm.quat.clone().multiply(ql);
    const fw=new V3(0,0,-1).applyQuaternion(q), up=new V3(0,1,0).applyQuaternion(q); setCam(pos,fw,up,Math.max(fov,70*DEG));
  } else if(view==='orbit'){
    orbit.yaw+=dx*0.007; orbit.pit=clampf(orbit.pit+dy*0.006,-0.6,1.4); if(!dx&&!dy) orbit.yaw+=dt*0.12;
    const dist=(L*1.2+10)*clampf(1+zoom*0.3,0.5,3); const c=dirOf(yawNow+orbit.yaw+Math.PI,orbit.pit); // looking from around the aircraft
    const pos=fm.pos.clone().addScaledVector(c,dist); groundClamp(pos,2.2); setCam(pos,fm.pos.clone().sub(pos),null,fov);
  } else { // tower
    const na=World.nearestAirport(fm.pos.x,fm.pos.z,26000);
    if(!na){ G.view='chase'; HUD.view='chase'; return flyCamera(run,dt); }
    const a=na.apt; const pos=new V3(a.x+260,Math.max(1,a.elev)+36,a.z+190); const d=fm.pos.clone().sub(pos); const dist=d.length(); const ang=2*Math.atan(Math.max(L,25)*2.0/Math.max(dist,50)); setCam(pos,d,null,clampf(ang,5*DEG,fov*1.4));
  }
}

/* ---------- menu scenes ---------- */
function sceneCamera(dt){
  const sc=G.scene; sc.t+=dt; const apt=APT[sc.apt]; const ends=Airports.runwayEnds(apt); const e=ends[0]; const t=e.thr;
  const ac=G.getModel(sc.plane); const L=ac.L; const hdg=e.hdg*DEG;
  const px=t.x+t.dir.x*90, pz=t.z+t.dir.z*90; const py=Math.max(1,apt.elev)+ac.gearH+0.02;
  const ang=sc.t*(sc.hangar?0.16:0.07)+(sc.hangar?0.7:2.35); const dist=L*(sc.hangar?1.45:1.9)+14; const el=sc.hangar?0.22:0.17;
  const dir=new V3(Math.sin(hdg+ang)*Math.cos(el),Math.sin(el),-Math.cos(hdg+ang)*Math.cos(el));
  const target=new V3(px,py+ac.R*0.8,pz); const pos=target.clone().addScaledVector(dir,dist); groundClamp(pos,1.6);
  // shift the aircraft to the right of centre so the menu fits on the left
  const fw=target.clone().sub(pos).normalize(); const right=new V3().crossVectors(fw,new V3(0,1,0)).normalize(); const wide=Render.W/Render.H>1.15&&!sc.centre; const shift=wide?(sc.hangar?-0.2:-0.3):0;
  const tgt2=target.clone().addScaledVector(right,shift*dist*0.9); if(sc.hangar&&Render.W/Render.H>1.15) tgt2.y-=dist*0.2; setCam(pos,tgt2.sub(pos),null,(sc.hangar?44:48)*DEG);
  return {px,py,pz,hdg:e.hdg,ac};
}
function drawPlane(ac,pos,quat,st,dt,t,night,lights){
  const m=M4.create(); M4.fromQuat(m,quat,pos.x-cam.pos.x,pos.y-cam.pos.y,pos.z-cam.pos.z);
  ac.update(st,dt,t,night); Models.draw(cam,ac,m,false); Models.draw(cam,ac,m,true);
  if(lights){ ac.lightsWorld(lights,m,cam.pos,st,t,night); }
}

/* ---------- frame ---------- */
function frame(ts){
  requestAnimationFrame(frame); if(!G.ready) return;
  let dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts; simT+=dt; Render.env.time=simT;
  const gl=Render.GL(); Render.resize();
  try{
    if(G.state==='fly'||G.state==='result') flyFrame(dt); else menuFrame(dt);
  }catch(e){ console.error(e); if(!G.errShown){ G.errShown=true; G.toast('Error: '+e.message); } }
}
function menuFrame(dt){
  const sc=sceneCamera(dt); const ac=sc.ac; const night=Render.env.night;
  Render.beginFrame(cam); Airports.update(cam); Airports.draw(cam,night);
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,-sc.hdg*DEG,0,'YXZ'));
  const st={gear:1,flapPos:0,ctl:{pitch:0,roll:0,yaw:0},spoil:0,thr:0.0,onGround:true,ap:{},landingLight:true};
  const dyn=Render.newDynPoints();
  drawPlane(ac,new V3(sc.px,sc.py,sc.pz),q,st,dt,simT,night,dyn);
  Render.cloudsPass(cam); Airports.drawLights(cam,night,cam.pos); Render.pointPass(cam,[],dyn,0.4+0.8*night);
}
function flyFrame(dt){
  const run=G.run; if(!run) return; const fm=run.fm; const night=Render.env.night;
  if(G.state==='fly'&&!G.paused){
    const ax=Input.update(dt,run); run.control({pitch:ax.pitch,roll:ax.roll,yaw:ax.yaw,thr:ax.thr,brake:ax.brake},dt);
    run.update(dt);
    for(const e of run.evq){ if(e.t==='crash'){ Sound.sfx('crash'); crashFx={t:0,p:fm.pos.clone()}; if(navigator.vibrate&&Profile.s().haptics) navigator.vibrate([200,80,300]); } else if(e.t==='touchdown'&&navigator.vibrate&&Profile.s().haptics) navigator.vibrate(e.d.sink>2?[60]:[20]); else if(e.t==='result'){ G.state='result'; Input.enabled=false; Sound.update({active:false}); setTimeout(()=>UI.result(e.res,run),e.res.ok?900:300); if(e.res.ok) Sound.sfx('success'); } }
    run.evq.length=0;
    if(run.fm.ap.on) $('bugs').style.display='flex'; else $('bugs').style.display='none';
    syncButtons(run);
  } else if(G.state==='result'){ cs.yaw+=dt*0.1; }
  flyCamera(run,dt);
  const spec=run.spec; const moving=!G.paused&&!fm.crashed&&G.state==='fly';
  Sound.update({active:moving,rpm:0.2+0.8*fm.thr,jet:spec.type==='jet',speed:fm.TAS,onGround:fm.onGround,gs:fm.groundSpeed(),cabin:G.view==='cockpit'});
  // render
  Render.beginFrame(cam); Airports.update(cam); Airports.draw(cam,night);
  const dyn=Render.newDynPoints();
  if(G.view!=='cockpit'||fm.crashed){ if(!(fm.crashed&&run.over>2.5&&G.state==='fly')) drawPlane(run.ac,fm.pos,fm.quat,{gear:fm.gear,flapPos:fm.flapPos,ctl:fm.ctl,spoil:fm.spoil,thr:fm.thr,onGround:fm.onGround,ap:fm.ap,landingLight:fm.landingLight||(night>0.3&&fm.agl<1500)},dt*(run.timeScale>1?1:1),simT,night,dyn); }
  // approach gates
  const gates=run.gates&&run.landingGoal&&!run.landed?run.gates():null;
  if(gates){ const s=Math.max(30,50); for(const g of gates){ const hw=22+g.d*0.012, rt={x:-g.dir.z,z:g.dir.x}; const n=10; for(let i=0;i<n*4;i++){ const side=Math.floor(i/n), u=(i%n)/n*2-1; let ox,oy; if(side===0){ox=u;oy=1;} else if(side===1){ox=1;oy=-u;} else if(side===2){ox=-u;oy=-1;} else {ox=-1;oy=u;} const wx=g.x+rt.x*ox*hw, wy=g.y+oy*hw*0.5, wz=g.z+rt.z*ox*hw; dyn.add(wx-cam.pos.x,wy-cam.pos.y,wz-cam.pos.z,0.1,0.8,1.0,1.0,5.5+Math.min(8,g.d*0.0016)); } } }
  // lesson/route waypoint beacon
  if(run.route&&run.routeI<run.route.length){ const r=run.route[run.routeI]; const gy=World.height(r.x,r.z); for(let k=0;k<14;k++) dyn.add(r.x-cam.pos.x,r.alt-120+k*18-cam.pos.y,r.z-cam.pos.z,1,0.5,0.95,1,10); }
  // crash fire
  if(crashFx){ crashFx.t+=dt; const T=crashFx.t; if(T<6){ const n=140; for(let i=0;i<n;i++){ const a=i*2.399, rr=Math.sqrt(i/n); const sp=(6+rr*26)*Math.min(T,1.8)*0.8; const hh=Math.abs(Math.sin(i*1.7))*(10+T*8)*(1-rr*0.4); const fade=Math.max(0,1-T/6); dyn.add(crashFx.p.x+Math.cos(a)*sp-cam.pos.x,crashFx.p.y+hh*(0.4+rr)-cam.pos.y,crashFx.p.z+Math.sin(a)*sp-cam.pos.z,1.0*fade,(0.35+0.3*rr)*fade,0.06*fade,1,12+rr*18); } } }
  Render.cloudsPass(cam); Airports.drawLights(cam,night,fm.pos); Render.pointPass(cam,[],dyn,0.5+0.9*night);
  // HUD
  if(G.state==='fly'||G.state==='result'){ HUD.draw(run,cam); if(!G.paused){ HUD.warnings(run,dt); HUD.dom(run,dt); HUD.mini(run); } }
}
function syncButtons(run){ const fm=run.fm; const set=(id,on)=>{ const e=$(id); if(e) e.classList.toggle('on',!!on); }; set('t-ap',fm.ap.on); set('t-at',fm.ap.at); set('t-nav',!!fm.ap.nav); set('t-gear',fm.gearCmd===1); set('t-sp',fm.spoilCmd); set('t-rev',fm.rev); set('t-li',fm.landingLight); set('t-warp',run.timeScale>1); }

return G;
})();
